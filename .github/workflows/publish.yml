name: Publish to npm

# Fires on git tag push (v0.1.2, v0.2.0, etc.). Uses npm's "trusted publishing"
# via GitHub Actions OIDC — no NPM_TOKEN secret required.
#
# Setup (one-time, on the npm side):
#   1. Go to https://www.npmjs.com/package/alza-mcp/access
#   2. Under "Trusted publishers", click "Add trusted publisher"
#   3. Choose "GitHub Actions" and enter:
#        Repository owner: lukabudik
#        Repository name:  alza-mcp
#        Workflow file:    publish.yml
#        Environment:      (leave blank)
#   4. Save.
#
# To release: `npm version patch && git push --follow-tags`

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npm publish --access public --provenance
