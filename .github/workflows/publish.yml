name: Publish to npm

# Fires on git tag push (v0.1.2, v0.2.0, etc.). Uses npm's "trusted publishing"
# via GitHub Actions OIDC — no NPM_TOKEN secret required.
#
# Setup (one-time, on the npm side):
#   1. Go to https://www.npmjs.com/package/alza-mcp-community/access
#   2. Under "Trusted publishers", click "Add trusted publisher"
#   3. Choose "GitHub Actions" and enter:
#        Repository owner: lukabudik
#        Repository name:  alza-mcp-community
#        Workflow file:    publish.yml
#        Environment:      (leave blank)
#   4. Save.
#
# To release: `npm version patch && git push --follow-tags`

on:
  push:
    tags:
      - "v*"
  # Re-run publishing for an existing tag (e.g. after a registry hiccup). Uses this
  # workflow file from the default branch but builds the tagged commit; every
  # publish step is idempotent, so already-published targets are skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish, e.g. v0.4.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for npm trusted publishing (and MCP Registry OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json version
        run: |
          tag_version="${TAG#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $TAG does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Verify server.json versions match package.json
        run: |
          node -e '
            const pkg = require("./package.json");
            const srv = require("./server.json");
            const bad = [];
            if (srv.version !== pkg.version) bad.push(`server.json version ${srv.version}`);
            const p0 = srv.packages && srv.packages[0];
            if (!p0 || p0.version !== pkg.version) bad.push(`server.json packages[0].version ${p0 && p0.version}`);
            const mcpb = require("./mcpb/manifest.json");
            if (mcpb.version !== pkg.version) bad.push(`mcpb/manifest.json version ${mcpb.version}`);
            if (srv.name !== pkg.mcpName) bad.push(`server.json name ${srv.name} != package.json mcpName ${pkg.mcpName}`);
            if (bad.length) { console.error(`Mismatch with package.json ${pkg.version}: ` + bad.join("; ")); process.exit(1); }
          '

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest

      - name: Publish to npm (skipped if this version is already published)
        shell: bash  # pipefail, so a failed npm publish is not masked by tee
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "alza-mcp-community@$version" version >/dev/null 2>&1; then
            echo "alza-mcp-community@$version is already on npm; skipping npm publish."
          elif ! npm publish --access public --provenance 2>&1 | tee npm-publish.log; then
            # A version npm accepted moments ago can be invisible to `npm view` but
            # still answer 409 "previously staged/published version": already done.
            grep -q "E409" npm-publish.log || exit 1
            echo "alza-mcp-community@$version was already published (409); continuing."
          fi

      # The registry validates that the npm version exists, and a fresh publish can
      # take a few minutes to become visible (v0.4.0 failed here with a 404).
      - name: Wait until the npm version is visible
        run: |
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 40); do
            if [ "$(npm view "alza-mcp-community@$version" version 2>/dev/null)" = "$version" ]; then
              echo "alza-mcp-community@$version is visible on npm."; exit 0
            fi
            echo "Waiting for alza-mcp-community@$version on npm ($i/40)…"; sleep 15
          done
          echo "alza-mcp-community@$version did not appear on npm within 10 minutes" >&2; exit 1

      # Official MCP Registry listing (runs only after npm publish succeeded,
      # because the registry verifies the npm package + mcpName exist).
      # CLI install and commands: https://github.com/modelcontextprotocol/registry
      # (docs/modelcontextprotocol-io/github-actions.mdx). The io.github.lukabudik/*
      # namespace is authorised by GitHub OIDC from this repository.
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: |
          for i in 1 2 3; do
            ./mcp-publisher publish && exit 0
            echo "mcp-publisher publish failed (attempt $i/3); retrying in 30 s…"; sleep 30
          done
          exit 1

  # Claude Desktop one-click bundle (.mcpb, https://github.com/anthropics/mcpb),
  # attached to the GitHub release for this tag.
  mcpb:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write  # create/update the release and upload the asset
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: ./scripts/build-mcpb.sh

      - name: Attach bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" build/*.mcpb --clobber
